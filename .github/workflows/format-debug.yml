name: Temporary format debug
on:
  push:
    branches:
      - remediation/task-06-interest-reconciliation
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/tests/liability-repository.integration.test.ts
      - run: git diff -- src/tests/liability-repository.integration.test.ts
