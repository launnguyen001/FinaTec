name: Task04 format report

on:
  push:
    branches:
      - "task/04-asset-management"

permissions:
  contents: read

jobs:
  format-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prettier patch for asset transaction service
        run: |
          npx prettier --write src/application/asset/asset-transaction-service.ts
          git --no-pager diff --unified=2 -- src/application/asset/asset-transaction-service.ts
