name: Task04 format report

on:
  push:
    branches:
      - "task/04-asset-management"

permissions:
  contents: read

jobs:
  format-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prettier patch for Task04 files
        run: |
          npx prettier --write \
            src/application/account/account-service.ts \
            src/application/asset/asset-transaction-service.ts \
            src/domain/asset/asset.ts \
            src/domain/asset/repository.ts \
            src/infrastructure/database/schema.ts \
            src/infrastructure/database/sqlite-asset-repository.ts \
            src/infrastructure/finance-runtime.ts \
            src/infrastructure/market-price/providers.ts \
            src/tests/asset-domain.test.ts
          git --no-pager diff --unified=2
