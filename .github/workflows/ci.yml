name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "task/**"

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint, format and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Temporary Prettier diagnostic
        run: |
          npx prettier --write src/application/liability/liability-service.test.ts src/infrastructure/database/sqlite-liability-repository.ts
          git diff -- src/application/liability/liability-service.test.ts src/infrastructure/database/sqlite-liability-repository.ts
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
