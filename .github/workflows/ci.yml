name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "task/**"

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint, format and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Diagnose Task06 unit-test formatter diff
        run: |
          npx prettier src/application/liability/liability-service.test.ts > /tmp/task06-test.formatted.ts
          diff -u src/application/liability/liability-service.test.ts /tmp/task06-test.formatted.ts || true
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
