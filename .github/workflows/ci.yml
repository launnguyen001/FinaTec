name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "task/**"

permissions:
  contents: write

jobs:
  validate:
    name: Typecheck, lint, format and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format and commit generated source formatting
        if: github.event_name == 'push'
        run: |
          npm run format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src app.json eas.json package.json tsconfig.json eslint.config.js README.md
            git commit -m "style(TASK-05): apply Prettier formatting"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
